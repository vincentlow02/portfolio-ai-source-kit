name: Verify source kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/audit-distribution.mjs
      - name: Verify PostgreSQL quota, privileges, and concurrent reservations
        env:
          PGPASSWORD: fixture-only-password
        run: |
          psql -X -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/portfolio-chat/quota-postgres.test.sql
          pids=()
          for i in $(seq 1 12); do
            psql -X -qAt -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'set role service_role; select public.vincent_ai_reserve_quota(100,5,1,0.01)' > "$RUNNER_TEMP/quota-$i.txt" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          accepted=$(cat "$RUNNER_TEMP"/quota-*.txt | grep -c '^t$' || true)
          test "$accepted" -eq 5
          test "$(psql -X -qAt -h localhost -U postgres -d postgres -c 'select day_requests from public.vincent_ai_quota')" -eq 5
      - name: Inspect source archive
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          unzip -Z1 "$RUNNER_TEMP/source.zip" | grep -v '/$' | sort > "$RUNNER_TEMP/archive.txt"
          git ls-files | sort > "$RUNNER_TEMP/tracked.txt"
          diff -u "$RUNNER_TEMP/tracked.txt" "$RUNNER_TEMP/archive.txt"
          python3 scripts/audit-release-zip.py "$RUNNER_TEMP/source.zip" --commit HEAD
          python3 scripts/test-audit-release-zip.py "$RUNNER_TEMP/source.zip" HEAD
      - run: npm run test:offline
      - run: npm run test:integration
      - name: Install GitHub registry item into two portfolios
        env:
          PORTFOLIO_AI_REGISTRY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/test-registry-install.mjs
      - name: Test a clean source archive
        run: |
          mkdir "$RUNNER_TEMP/archive-check"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/archive-check"
          cd "$RUNNER_TEMP/archive-check"
          npm ci --no-audit --no-fund
          npm run test:offline
          npm run test:integration
